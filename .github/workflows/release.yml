name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to create the GitHub Release
      id-token: write       # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci

      - name: Lint, typecheck, test, build
        run: |
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Tag and package.json both at $PKG ✓"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The tag that triggered this workflow (e.g. v0.2.0).
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Auto-generate notes from commits since the previous tag.
          generate_release_notes: true
          # Marks the newest as "Latest" automatically.
          make_latest: true
